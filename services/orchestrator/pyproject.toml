[project]
name = "orchestrator"
version = "0.1.0"
description = "Failover Forge control plane: loadgen, injection, events, aggregation, WS, reports"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
